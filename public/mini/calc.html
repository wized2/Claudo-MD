<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Calculator</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px 14px 26px;gap:12px;user-select:none;touch-action:manipulation}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1 small{display:block;font-size:10px;font-weight:500;color:var(--mut);letter-spacing:.22em;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
button{cursor:pointer}button:active{transform:scale(.96)}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1;padding:9px 6px;font-size:14px}
.chips button.on{background:var(--ac2);color:#fff;border-color:transparent}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.big{font-size:34px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
</style></head><body><div class="w">
<h1>Calculator<small>no network needed</small></h1>
<style>#d{text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
#h{color:var(--mut);font-size:15px;min-height:20px;word-break:break-all}#e{font-size:38px;font-weight:700;word-break:break-all;font-variant-numeric:tabular-nums}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k button{font-size:22px;padding:0;aspect-ratio:1.15}
.k .o{color:var(--ac2)}.k .f{color:var(--bad)}.k .w{grid-column:span 4;aspect-ratio:auto;padding:16px}.k .eq{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}</style>
<div class="card" id="d"><div id="h"></div><div id="e">0</div></div><div class="k" id="k"></div>
<script>
var ex='',last='',fresh=0;var E=document.getElementById('e'),H=document.getElementById('h');
var L=[['AC','f'],['(',''],[')',''],['⌫','f'],['7'],['8'],['9'],['÷','o'],['4'],['5'],['6'],['×','o'],['1'],['2'],['3'],['−','o'],['%','o'],['0'],['.'],['+','o'],['=','eq w']];
function show(){E.textContent=ex||'0';H.textContent=last;E.style.fontSize=ex.length>12?'26px':'38px'}
function ev(s){var t=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').match(/\d*\.?\d+|[-+*\/()%]/g)||[],i=0;
function pe(){var v=pt();while(t[i]=='+'||t[i]=='-'){var o=t[i++],r=pt();v=o=='+'?v+r:v-r}return v}
function pt(){var v=pf();while(t[i]=='*'||t[i]=='/'){var o=t[i++],r=pf();v=o=='*'?v*r:v/r}return v}
function pf(){var v;if(t[i]=='-'){i++;return -pf()}if(t[i]=='('){i++;v=pe();if(t[i]!=')')throw 0;i++}else{v=parseFloat(t[i++]);if(isNaN(v))throw 0}while(t[i]=='%'){i++;v/=100}return v}
var r=pe();if(i<t.length)throw 0;return r}
function fmt(n){if(!isFinite(n))throw 0;return String(+n.toPrecision(12))}
function press(k){
if(k=='AC'){ex='';last='';fresh=0}
else if(k=='⌫')ex=ex.slice(0,-1);
else if(k=='='){if(ex){try{var r=fmt(ev(ex));last=ex+' =';ex=r;fresh=1}catch(e){last='error';ex=''}}}
else if(k=='±'){if(ex[0]=='−')ex=ex.slice(1);else if(ex)ex='−'+ex}
else{if(fresh&&/[0-9.(]/.test(k))ex='';
 if(/[+×÷−]/.test(k)&&/[+×÷−]$/.test(ex))ex=ex.slice(0,-1);
 if(/[+×÷]/.test(k)&&!ex)return;ex+=k;fresh=0}
show()}
var K=document.getElementById('k');L.forEach(function(a){var b=document.createElement('button');b.textContent=a[0];b.className=a[1]||'';b.onclick=function(){press(a[0])};K.appendChild(b)});
document.addEventListener('keydown',function(e){var m={'*':'×','/':'÷','-':'−','Enter':'=','Backspace':'⌫','Escape':'AC'};var k=m[e.key]||e.key;if(L.some(function(a){return a[0]==k}))press(k)});show();
</script>
</div></body></html>
