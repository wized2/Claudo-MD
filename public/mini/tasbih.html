<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tasbih Counter</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px 14px 26px;gap:12px;user-select:none;touch-action:manipulation}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1 small{display:block;font-size:10px;font-weight:500;color:var(--mut);letter-spacing:.22em;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
button{cursor:pointer}button:active{transform:scale(.96)}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1;padding:9px 6px;font-size:14px}
.chips button.on{background:var(--ac2);color:#fff;border-color:transparent}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.big{font-size:34px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
</style></head><body><div class="w">
<h1>Tasbih<small>count your dhikr</small></h1>
<style>#btn{height:210px;border-radius:50%;width:210px;align-self:center;font-size:62px;font-weight:700;background:var(--ac);color:#06130d;border:0;box-shadow:0 0 0 10px rgba(124,240,192,.15)}
#btn:active{transform:scale(.96)}.ring{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.ring i{display:block;height:100%;width:0;background:var(--ac2);transition:width .15s}
.ar{font-size:30px;text-align:center;line-height:1.6;direction:rtl}</style>
<div class="card" style="text-align:center"><div class="ar" id="ar"></div><div class="lbl" id="nm" style="margin:0"></div></div>
<div class="chips" id="tg"></div>
<div class="ring"><i id="bar"></i></div>
<button id="btn">0</button>
<div class="card row" style="text-align:center"><div><div class="lbl">Round</div><b class="big" id="rd" style="font-size:24px">0</b></div><div><div class="lbl">Total</div><b class="big" id="tt" style="font-size:24px">0</b></div></div>
<div class="row"><button id="un">Undo</button><button id="nx">Next dhikr</button><button id="rs">Reset</button></div>
<script>
var $=function(i){return document.getElementById(i)},T=[['سُبْحَانَ ٱللَّٰهِ','SubhanAllah'],['ٱلْحَمْدُ لِلَّٰهِ','Alhamdulillah'],['ٱللَّٰهُ أَكْبَرُ','Allahu Akbar'],['لَا إِلَٰهَ إِلَّا ٱللَّٰهُ','La ilaha illallah'],['أَسْتَغْفِرُ ٱللَّٰهَ','Astaghfirullah']],i=0,goal=33,n=0,rounds=0,total=0;
function vib(a){try{navigator.vibrate&&navigator.vibrate(a)}catch(e){}}
function ui(){$('ar').textContent=T[i][0];$('nm').textContent=T[i][1]+' - target '+goal;$('btn').textContent=n;$('rd').textContent=rounds;$('tt').textContent=total;$('bar').style.width=(n/goal*100)+'%'}
$('btn').onclick=function(){n++;total++;if(n>=goal){n=0;rounds++;vib([60,40,60])}else vib(10);ui()};
$('un').onclick=function(){if(n>0){n--;total--}else if(rounds>0){rounds--;n=goal-1;total--}ui()};
$('nx').onclick=function(){i=(i+1)%T.length;n=0;ui()};
$('rs').onclick=function(){n=0;rounds=0;total=0;ui()};
[33,99,100].forEach(function(g){var b=document.createElement('button');b.textContent=g;b.className=g==goal?'on':'';b.onclick=function(){goal=g;n=0;[].forEach.call($('tg').children,function(x){x.className=x.textContent==g?'on':''});ui()};$('tg').appendChild(b)});ui();
</script>
</div></body></html>
