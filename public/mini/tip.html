<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tip and Split</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px 14px 26px;gap:12px;user-select:none;touch-action:manipulation}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1 small{display:block;font-size:10px;font-weight:500;color:var(--mut);letter-spacing:.22em;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
button{cursor:pointer}button:active{transform:scale(.96)}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1;padding:9px 6px;font-size:14px}
.chips button.on{background:var(--ac2);color:#fff;border-color:transparent}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.big{font-size:34px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
</style></head><body><div class="w">
<h1>Tip and Split<small>share the bill fairly</small></h1>
<div class="card"><div class="lbl">Bill</div><input id="b" type="number" inputmode="decimal" placeholder="0.00" style="width:100%;font-size:28px;font-weight:700"></div>
<div class="card"><div class="lbl">Tip <b id="tv" style="color:var(--ac)">15%</b></div><div class="chips" id="tc"></div><input id="ts" type="range" min="0" max="40" value="15" style="width:100%;margin-top:10px;padding:0"></div>
<div class="card"><div class="lbl">People</div><div class="row"><button id="mi">−</button><div class="big" id="pn" style="text-align:center">1</div><button id="pl">+</button></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><span class="lbl">Tip</span><b id="rt">0.00</b></div><div class="row" style="justify-content:space-between"><span class="lbl">Total</span><b id="rtot">0.00</b></div><div class="row" style="justify-content:space-between;margin-top:6px"><span class="lbl" style="color:var(--ac)">Each person</span><b class="big" id="re" style="color:var(--ac);text-align:right">0.00</b></div></div>
<script>
var $=function(i){return document.getElementById(i)},n=1,tip=15;
[10,15,18,20,25].forEach(function(v){var b=document.createElement('button');b.textContent=v+'%';b.onclick=function(){tip=v;$('ts').value=v;c()};$('tc').appendChild(b)});
function c(){var b=parseFloat($('b').value)||0,t=b*tip/100,tot=b+t;$('tv').textContent=tip+'%';$('pn').textContent=n;$('rt').textContent=t.toFixed(2);$('rtot').textContent=tot.toFixed(2);$('re').textContent=(tot/n).toFixed(2)}
$('b').oninput=c;$('ts').oninput=function(){tip=+this.value;c()};$('mi').onclick=function(){if(n>1)n--;c()};$('pl').onclick=function(){if(n<50)n++;c()};c();
</script>
</div></body></html>
