<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Unit Converter</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px 14px 26px;gap:12px;user-select:none;touch-action:manipulation}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1 small{display:block;font-size:10px;font-weight:500;color:var(--mut);letter-spacing:.22em;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
button{cursor:pointer}button:active{transform:scale(.96)}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1;padding:9px 6px;font-size:14px}
.chips button.on{background:var(--ac2);color:#fff;border-color:transparent}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.big{font-size:34px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
</style></head><body><div class="w">
<h1>Unit Converter<small>works offline</small></h1>
<div class="chips" id="cat" style="flex-wrap:wrap"></div>
<div class="card"><div class="lbl">From</div><div class="row"><input id="v" type="number" inputmode="decimal" value="1" style="flex:1.4;font-size:22px"><select id="a"></select></div></div>
<div style="text-align:center"><button id="sw" style="padding:6px 18px">⇅</button></div>
<div class="card"><div class="lbl">To</div><div class="row"><div class="big" id="o" style="flex:1.4;font-size:24px;word-break:break-all">0</div><select id="z"></select></div></div>
<script>
var $=function(i){return document.getElementById(i)};
var U={Length:{m:1,km:1000,cm:.01,mm:.001,mile:1609.344,yard:.9144,foot:.3048,inch:.0254},Weight:{kg:1,g:.001,mg:1e-6,lb:.45359237,oz:.028349523,tonne:1000},Volume:{L:1,mL:.001,gal:3.785411784,qt:.946352946,cup:.2365882365,'fl oz':.0295735296},Speed:{'m/s':1,'km/h':.277777778,mph:.44704,knot:.514444444},Data:{B:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776},Area:{'m²':1,'km²':1e6,hectare:1e4,acre:4046.8564224,'ft²':.09290304},Temp:{'°C':1,'°F':1,K:1}};
var cat='Length';
function T(v,f,t){var c=f=='°C'?v:f=='°F'?(v-32)*5/9:v-273.15;return t=='°C'?c:t=='°F'?c*9/5+32:c+273.15}
function fill(){var k=Object.keys(U[cat]);[$('a'),$('z')].forEach(function(s,i){s.innerHTML=k.map(function(x){return'<option>'+x+'</option>'}).join('');s.selectedIndex=Math.min(i,k.length-1)});c()}
function c(){var v=parseFloat($('v').value),f=$('a').value,t=$('z').value;if(isNaN(v)){$('o').textContent='-';return}
var r=cat=='Temp'?T(v,f,t):v*U[cat][f]/U[cat][t];$('o').textContent=String(+r.toPrecision(8))}
Object.keys(U).forEach(function(k){var b=document.createElement('button');b.textContent=k;b.className=k==cat?'on':'';b.onclick=function(){cat=k;[].forEach.call($('cat').children,function(x){x.className=x.textContent==k?'on':''});fill()};$('cat').appendChild(b)});
$('v').oninput=c;$('a').onchange=c;$('z').onchange=c;$('sw').onclick=function(){var i=$('a').selectedIndex;$('a').selectedIndex=$('z').selectedIndex;$('z').selectedIndex=i;c()};fill();
</script>
</div></body></html>
