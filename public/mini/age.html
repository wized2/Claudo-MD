<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Age Calculator</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px 14px 26px;gap:12px;user-select:none;touch-action:manipulation}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1 small{display:block;font-size:10px;font-weight:500;color:var(--mut);letter-spacing:.22em;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
button{cursor:pointer}button:active{transform:scale(.96)}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1;padding:9px 6px;font-size:14px}
.chips button.on{background:var(--ac2);color:#fff;border-color:transparent}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.big{font-size:34px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
</style></head><body><div class="w">
<h1>Age<small>exact age and next birthday</small></h1>
<div class="card"><div class="lbl">Date of birth</div><div class="row"><select id="d"></select><select id="mo"></select><select id="y"></select></div></div>
<div class="card" style="text-align:center"><div class="lbl">You are</div><div class="big" id="a" style="font-size:30px">-</div><div id="x" style="color:var(--mut);margin-top:6px"></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><span class="lbl">Next birthday</span><b id="nb">-</b></div><div class="row" style="justify-content:space-between;margin-top:6px"><span class="lbl">Days to go</span><b id="dg">-</b></div><div class="row" style="justify-content:space-between;margin-top:6px"><span class="lbl">Total days lived</span><b id="td">-</b></div></div>
<script>
var $=function(i){return document.getElementById(i)},M='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' '),now=new Date();
for(var i=1;i<=31;i++)$('d').add(new Option(i,i));M.forEach(function(m,i){$('mo').add(new Option(m,i))});for(var y=now.getFullYear();y>=1920;y--)$('y').add(new Option(y,y));
$('d').value=1;$('mo').value=0;$('y').value=2000;
function c(){var d=+$('d').value,m=+$('mo').value,y=+$('y').value,b=new Date(y,m,d);if(b.getMonth()!=m){$('a').textContent='invalid date';return}
var t=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(b>t){$('a').textContent='in the future';return}
var Y=t.getFullYear()-y,Mo=t.getMonth()-m,D=t.getDate()-d;if(D<0){Mo--;D+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(Mo<0){Y--;Mo+=12}
$('a').textContent=Y+' years';$('x').textContent=Mo+' months, '+D+' days';
var n=new Date(t.getFullYear(),m,d);if(n<t)n=new Date(t.getFullYear()+1,m,d);
$('nb').textContent=n.toDateString().slice(0,15);$('dg').textContent=Math.round((n-t)/864e5);$('td').textContent=Math.round((t-b)/864e5).toLocaleString()}
['d','mo','y'].forEach(function(i){$(i).onchange=c});c();
</script>
</div></body></html>
