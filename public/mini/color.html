<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Color Picker</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px 14px 26px;gap:12px;user-select:none;touch-action:manipulation}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1 small{display:block;font-size:10px;font-weight:500;color:var(--mut);letter-spacing:.22em;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
button{cursor:pointer}button:active{transform:scale(.96)}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1;padding:9px 6px;font-size:14px}
.chips button.on{background:var(--ac2);color:#fff;border-color:transparent}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.big{font-size:34px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
</style></head><body><div class="w">
<h1>Color<small>tap to pick</small></h1>
<div class="card" id="pv" style="height:110px;border-radius:18px"></div>
<div class="chips" id="hs" style="gap:6px"></div>
<div class="card"><div class="row"><div class="lbl" style="margin:0">Lightness <b id="lv" style="color:var(--ac)"></b></div><div class="row" style="flex:none;width:130px"><button id="lm">−</button><button id="lp">+</button></div></div>
<div class="row" style="margin-top:10px"><div class="lbl" style="margin:0">Saturation <b id="sv" style="color:var(--ac)"></b></div><div class="row" style="flex:none;width:130px"><button id="sm">−</button><button id="sp">+</button></div></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><b id="hx" style="font-size:22px;font-family:ui-monospace,Menlo,monospace">#</b><button id="c1" style="flex:none">Copy</button></div><div id="rg" style="color:var(--mut);margin-top:6px"></div><div id="hl" style="color:var(--mut)"></div></div>
<script>
var $=function(i){return document.getElementById(i)},H=200,S=70,Lt=55;
function rgb(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l),f=function(n){var k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return[f(0),f(8),f(4)]}
function up(){var c=rgb(H,S,Lt),hx='#'+c.map(function(x){return x.toString(16).padStart(2,'0')}).join('').toUpperCase();$('pv').style.background=hx;$('hx').textContent=hx;$('rg').textContent='rgb('+c.join(', ')+')';$('hl').textContent='hsl('+H+', '+S+'%, '+Lt+'%)';$('lv').textContent=Lt+'%';$('sv').textContent=S+'%'}
for(var h=0;h<360;h+=30){(function(h){var b=document.createElement('button');b.style.cssText='flex:none;width:40px;height:40px;padding:0;border-radius:50%;background:hsl('+h+',70%,55%)';b.onclick=function(){H=h;up()};$('hs').appendChild(b)})(h)}
$('lm').onclick=function(){Lt=Math.max(5,Lt-5);up()};$('lp').onclick=function(){Lt=Math.min(95,Lt+5);up()};$('sm').onclick=function(){S=Math.max(0,S-10);up()};$('sp').onclick=function(){S=Math.min(100,S+10);up()};
var hb=document.createElement('div');hb.className='row';hb.innerHTML='<button id="hm">Hue −</button><button id="hp">Hue +</button>';$('hs').parentNode.insertBefore(hb,$('hs').nextSibling);
$('hm').onclick=function(){H=(H+350)%360;up()};$('hp').onclick=function(){H=(H+10)%360;up()};
$('c1').onclick=function(){var t=$('hx').textContent,b=this;try{navigator.clipboard.writeText(t).then(function(){b.textContent='Copied'})}catch(e){b.textContent=t}setTimeout(function(){b.textContent='Copy'},1200)};up();
</script>
</div></body></html>
