<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Password Maker</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px 14px 26px;gap:12px;user-select:none;touch-action:manipulation}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1 small{display:block;font-size:10px;font-weight:500;color:var(--mut);letter-spacing:.22em;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
button{cursor:pointer}button:active{transform:scale(.96)}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1;padding:9px 6px;font-size:14px}
.chips button.on{background:var(--ac2);color:#fff;border-color:transparent}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.big{font-size:34px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
</style></head><body><div class="w">
<h1>Password Maker<small>made on your device</small></h1>
<div class="card"><div class="big" id="o" style="font-size:20px;word-break:break-all;min-height:60px;user-select:text;font-family:ui-monospace,Menlo,monospace"></div><div class="lbl" style="margin:10px 0 0">Strength <b id="st" style="color:var(--ac)"></b></div></div>
<div class="card"><div class="lbl">Length <b id="ln" style="color:var(--ac)">16</b></div><div class="row"><button id="lm">−</button><input id="l" type="range" min="6" max="48" value="16" style="flex:4;padding:0"><button id="lp">+</button></div></div>
<div class="chips" id="o2"></div>
<div class="row"><button class="pri" id="g">Generate</button><button id="cp">Copy</button></div>
<script>
var $=function(i){return document.getElementById(i)},S={'a-z':'abcdefghijklmnopqrstuvwxyz','A-Z':'ABCDEFGHIJKLMNOPQRSTUVWXYZ','0-9':'0123456789','#$%':'!@#$%^&*()-_=+[]{};:,.?'},on={'a-z':1,'A-Z':1,'0-9':1,'#$%':1};
Object.keys(S).forEach(function(k){var b=document.createElement('button');b.textContent=k;b.className='on';b.onclick=function(){on[k]=!on[k];b.className=on[k]?'on':'';if(!Object.keys(on).some(function(x){return on[x]})){on[k]=1;b.className='on'}gen()};$('o2').appendChild(b)});
function rnd(n){var a=new Uint32Array(1),lim=4294967296-4294967296%n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function gen(){var n=+$('l').value,sets=Object.keys(S).filter(function(k){return on[k]}),pool=sets.map(function(k){return S[k]}).join(''),p=sets.map(function(k){return S[k][rnd(S[k].length)]});
while(p.length<n)p.push(pool[rnd(pool.length)]);for(var i=p.length-1;i>0;i--){var j=rnd(i+1),t=p[i];p[i]=p[j];p[j]=t}
$('o').textContent=p.join('');$('ln').textContent=n;var bits=n*Math.log2(pool.length);$('st').textContent=bits<45?'weak':bits<70?'good':bits<100?'strong':'excellent'}
$('l').oninput=gen;$('lm').onclick=function(){$('l').value=Math.max(6,+$('l').value-1);gen()};$('lp').onclick=function(){$('l').value=Math.min(48,+$('l').value+1);gen()};$('g').onclick=gen;
$('cp').onclick=function(){var t=$('o').textContent,b=this;function ok(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1200)}
try{navigator.clipboard.writeText(t).then(ok,function(){sel()})}catch(e){sel()}function sel(){var r=document.createRange();r.selectNodeContents($('o'));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected'}};gen();
</script>
</div></body></html>
