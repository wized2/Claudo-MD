<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dice Roller</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px 14px 26px;gap:12px;user-select:none;touch-action:manipulation}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1 small{display:block;font-size:10px;font-weight:500;color:var(--mut);letter-spacing:.22em;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
button{cursor:pointer}button:active{transform:scale(.96)}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1;padding:9px 6px;font-size:14px}
.chips button.on{background:var(--ac2);color:#fff;border-color:transparent}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.big{font-size:34px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
</style></head><body><div class="w">
<h1>Dice<small>roll one or many</small></h1>
<style>.dd{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:90px;align-items:center}.dc{min-width:64px;height:64px;border-radius:16px;background:var(--card);border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--ac)}@keyframes rl{0%{transform:rotate(-40deg) scale(.7)}60%{transform:rotate(15deg) scale(1.1)}100%{transform:none}}.dc.a{animation:rl .4s}</style>
<div class="chips" id="s"></div>
<div class="card"><div class="lbl">Number of dice</div><div class="row"><button id="mi">−</button><div class="big" id="c" style="text-align:center">1</div><button id="pl">+</button></div></div>
<div class="card"><div class="dd" id="o"></div><div style="text-align:center;margin-top:8px"><span class="lbl">Total</span> <b class="big" id="t" style="color:var(--ac)">-</b></div></div>
<button class="pri" id="g" style="font-size:20px;padding:16px">Roll</button>
<script>
var $=function(i){return document.getElementById(i)},sd=6,n=1;
function rnd(k){var a=new Uint32Array(1),l=4294967296-4294967296%k;do{crypto.getRandomValues(a)}while(a[0]>=l);return a[0]%k+1}
[4,6,8,10,12,20,100].forEach(function(k){var b=document.createElement('button');b.textContent='d'+k;b.className=k==6?'on':'';b.onclick=function(){sd=k;[].forEach.call($('s').children,function(x){x.className=x.textContent=='d'+k?'on':''})};$('s').appendChild(b)});
function roll(){var r=[],t=0;for(var i=0;i<n;i++){var v=rnd(sd);r.push(v);t+=v}$('o').innerHTML=r.map(function(v){return'<div class="dc a">'+v+'</div>'}).join('');$('t').textContent=t;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
$('g').onclick=roll;$('mi').onclick=function(){n=Math.max(1,n-1);$('c').textContent=n};$('pl').onclick=function(){n=Math.min(10,n+1);$('c').textContent=n};
</script>
</div></body></html>
