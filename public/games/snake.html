<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Snake</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:18px 16px 28px;gap:14px;user-select:none;touch-action:manipulation}
h1{margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
h1 small{display:block;font-size:11px;font-weight:500;color:var(--mut);letter-spacing:.2em;margin-top:2px}
.bar{display:flex;gap:10px;width:100%;max-width:420px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center}
.pill b{display:block;font-size:20px}.pill span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
button:active{transform:scale(.97)}
.msg{min-height:24px;color:var(--mut);letter-spacing:.06em}
canvas{width:min(92vw,400px);aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:18px}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}.pad button{height:56px;font-size:20px}
</style></head><body>
<h1>Snake<small>Swipe or use the pad</small></h1>
<div class="bar"><div class="pill"><b id="s">0</b><span>Score</span></div><div class="pill"><b id="h">0</b><span>Best</span></div></div>
<canvas id="c" width="400" height="400"></canvas><div class="msg" id="m">Press start</div>
<div class="pad"><span></span><button data-d="u">&#9650;</button><span></span><button data-d="l">&#9664;</button><button class="pri" id="go">Go</button><button data-d="r">&#9654;</button><span></span><button data-d="d">&#9660;</button><span></span></div>
<script>
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const N=20,S=20,cv=document.getElementById('c'),x=cv.getContext('2d');let sn,dir,nd,f,sc,t,best=+(ls('snk')||0);h.textContent=best;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
function food(){do{f={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(p=>p.x==f.x&&p.y==f.y))}
function start(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=nd={x:1,y:0};sc=0;s.textContent=0;food();clearInterval(t);t=setInterval(step,120);m.textContent=''}
function step(){dir=nd;const hd={x:sn[0].x+dir.x,y:sn[0].y+dir.y};if(hd.x<0||hd.y<0||hd.x>=N||hd.y>=N||sn.some(p=>p.x==hd.x&&p.y==hd.y)){clearInterval(t);m.textContent='Game over';if(sc>best){best=sc;h.textContent=best;try{lset('snk',best)}catch(e){}}return}
sn.unshift(hd);if(hd.x==f.x&&hd.y==f.y){sc++;s.textContent=sc;food()}else sn.pop();draw()}
function draw(){x.clearRect(0,0,400,400);x.fillStyle=css('--bad');x.beginPath();x.arc(f.x*S+10,f.y*S+10,7,0,7);x.fill();sn.forEach((p,i)=>{x.fillStyle=i?css('--ac2'):css('--ac');x.beginPath();x.roundRect(p.x*S+1,p.y*S+1,S-2,S-2,6);x.fill()})}
function turn(d){const m={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}}[d];if(m.x+dir.x||m.y+dir.y)nd=m}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(b.dataset.d));go.onclick=start;
addEventListener('keydown',e=>{const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(k){turn(k);e.preventDefault()}});
let sx,sy;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))});
sn=[{x:10,y:10}];f={x:5,y:5};dir=nd={x:1,y:0};draw();
</script></body></html>
