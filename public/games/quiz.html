<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Quiz</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:18px 16px 28px;gap:14px;user-select:none;touch-action:manipulation}
h1{margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
h1 small{display:block;font-size:11px;font-weight:500;color:var(--mut);letter-spacing:.2em;margin-top:2px}
.bar{display:flex;gap:10px;width:100%;max-width:420px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center}
.pill b{display:block;font-size:20px}.pill span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
button:active{transform:scale(.97)}
.msg{min-height:24px;color:var(--mut);letter-spacing:.06em}
.q{width:min(92vw,420px);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;font-size:18px;font-weight:600}
.o{display:flex;flex-direction:column;gap:10px;width:min(92vw,420px)}.o button{text-align:left;padding:14px 16px}
.o button.ok{border-color:var(--ac);color:var(--ac)}.o button.no{border-color:var(--bad);color:var(--bad)}
.tm{width:min(92vw,420px);height:6px;background:var(--line);border-radius:6px;overflow:hidden}.tm i{display:block;height:100%;background:var(--ac);width:100%}
</style></head><body>
<h1>Quiz<small>10 questions, 15 seconds each</small></h1>
<div class="bar"><div class="pill"><b id="n">1/10</b><span>Question</span></div><div class="pill"><b id="s">0</b><span>Score</span></div></div>
<div class="tm"><i id="t"></i></div><div class="q" id="q"></div><div class="o" id="o"></div><div class="msg" id="m"></div><button class="pri" id="nx" style="display:none">Next</button>
<script>
const Q=[["Which planet is known as the Red Planet?",["Mars","Venus","Jupiter","Mercury"],0],["What is the capital of Pakistan?",["Karachi","Islamabad","Lahore","Quetta"],1],["How many continents are there?",["5","6","7","8"],2],["Which gas do plants absorb from the air?",["Oxygen","Nitrogen","Carbon dioxide","Helium"],2],["What is the largest ocean?",["Atlantic","Pacific","Indian","Arctic"],1],["How many bits are in a byte?",["4","8","16","32"],1],["What does CPU stand for?",["Central Processing Unit","Computer Power Unit","Core Program Unit","Central Program Utility"],0],["Which is the tallest mountain on Earth?",["K2","Kangchenjunga","Everest","Lhotse"],2],["What is H2O?",["Salt","Water","Hydrogen","Oxygen"],1],["Which language runs in web browsers?",["Python","JavaScript","C","Rust"],1],["How many days are in a leap year?",["364","365","366","367"],2],["Which is the fastest land animal?",["Lion","Horse","Cheetah","Leopard"],2],["What is the square root of 144?",["10","11","12","14"],2],["Which planet is famous for its rings?",["Saturn","Mars","Earth","Neptune"],0],["Which year did World War II end?",["1943","1945","1947","1950"],1]];
let qs,i,sc,tm,left;
function start(){qs=[...Q].sort(()=>Math.random()-.5).slice(0,10);i=0;sc=0;s.textContent=0;nx.style.display='none';show()}
function show(){if(i>=10){clearInterval(tm);q.textContent='Finished';o.innerHTML='';m.textContent='You scored '+sc+' out of 10';nx.textContent='Play again';nx.style.display='';nx.onclick=start;t.style.width='0';return}
const[x,opts,a]=qs[i];n.textContent=(i+1)+'/10';q.textContent=x;m.textContent='';nx.style.display='none';o.innerHTML='';opts.forEach((v,k)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>pick(b,k,a);o.appendChild(b)});left=15;clearInterval(tm);t.style.width='100%';tm=setInterval(()=>{left-=.1;t.style.width=(left/15*100)+'%';if(left<=0){pick(null,-1,a)}},100)}
function pick(b,k,a){clearInterval(tm);[...o.children].forEach((e,j)=>{e.disabled=true;if(j==a)e.classList.add('ok')});if(k==a){sc++;s.textContent=sc;m.textContent='Correct'}else{if(b)b.classList.add('no');m.textContent=k<0?'Time is up':'Wrong'}nx.textContent=i==9?'See score':'Next';nx.style.display='';nx.onclick=()=>{i++;show()}}
start();
</script></body></html>
