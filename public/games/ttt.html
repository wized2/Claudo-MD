<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tic Tac Toe</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:18px 16px 28px;gap:14px;user-select:none;touch-action:manipulation}
h1{margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
h1 small{display:block;font-size:11px;font-weight:500;color:var(--mut);letter-spacing:.2em;margin-top:2px}
.bar{display:flex;gap:10px;width:100%;max-width:420px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center}
.pill b{display:block;font-size:20px}.pill span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
button:active{transform:scale(.97)}
.msg{min-height:24px;color:var(--mut);letter-spacing:.06em}
.board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;width:min(88vw,380px);aspect-ratio:1}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;font-size:min(16vw,64px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.c.x{color:var(--ac)}.c.o{color:var(--ac2)}.c.w{box-shadow:0 0 0 2px var(--ac) inset;background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.row{display:flex;gap:8px}.row button.on{border-color:var(--ac);color:var(--ac)}
</style></head><body>
<h1>Tic Tac Toe<small>You are &#10005;</small></h1>
<div class="bar"><div class="pill"><b id="sw">0</b><span>You</span></div><div class="pill"><b id="sd">0</b><span>Draw</span></div><div class="pill"><b id="sl">0</b><span>Bot</span></div></div>
<div class="row" id="lv"><button data-l="0">Easy</button><button data-l="1" class="on">Normal</button><button data-l="2">Hard</button></div>
<div class="board" id="b"></div><div class="msg" id="m">Your move</div><button class="pri" id="r">New game</button>
<script>
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let b,over,lvl=1,sc={w:0,d:0,l:0};
const win=a=>{for(const l of L)if(a[l[0]]&&a[l[0]]==a[l[1]]&&a[l[1]]==a[l[2]])return l;return null};
function mm(a,t){const w=win(a);if(w)return a[w[0]]=='O'?10:-10;if(a.every(Boolean))return 0;const s=[];a.forEach((c,i)=>{if(!c){a[i]=t;s.push(mm(a,t=='O'?'X':'O'));a[i]=null}});return t=='O'?Math.max(...s):Math.min(...s)}
function bot(){const f=b.map((c,i)=>c?-1:i).filter(i=>i>=0);if(lvl==0||(lvl==1&&Math.random()<.35))return f[Math.random()*f.length|0];let best=-99,mv=f[0];for(const i of f){b[i]='O';const s=mm(b,'X');b[i]=null;if(s>best){best=s;mv=i}}return mv}
const el=document.getElementById('b'),msg=document.getElementById('m');
function draw(w){el.innerHTML='';b.forEach((v,i)=>{const d=document.createElement('div');d.className='c '+(v?v.toLowerCase():'')+(w&&w.includes(i)?' w':'');d.textContent=v=='X'?'✕':v=='O'?'○':'';d.onclick=()=>play(i);el.appendChild(d)})}
function end(){const w=win(b);if(w){over=1;const me=b[w[0]]=='X';me?sc.w++:sc.l++;msg.textContent=me?'You win':'Bot wins';draw(w)}else if(b.every(Boolean)){over=1;sc.d++;msg.textContent='Draw';draw()}else return 0;sw.textContent=sc.w;sd.textContent=sc.d;sl.textContent=sc.l;return 1}
function play(i){if(over||b[i])return;b[i]='X';draw();if(end())return;setTimeout(()=>{b[bot()]='O';draw();if(!end())msg.textContent='Your move'},260)}
function reset(){b=Array(9).fill(null);over=0;msg.textContent='Your move';draw()}
r.onclick=reset;document.querySelectorAll('#lv button').forEach(x=>x.onclick=()=>{lvl=+x.dataset.l;document.querySelectorAll('#lv button').forEach(y=>y.classList.toggle('on',y==x));reset()});reset();
</script></body></html>
