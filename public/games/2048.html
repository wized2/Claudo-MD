<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>2048</title><style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#e8ecf4;--mut:#8b95a8;--ac:#7cf0c0;--ac2:#6aa8ff;--bad:#ff7a8a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--tx:#141922;--mut:#5d687c;--ac:#0a9c6b;--ac2:#2b6be0;--bad:#d6334a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:18px 16px 28px;gap:14px;user-select:none;touch-action:manipulation}
h1{margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
h1 small{display:block;font-size:11px;font-weight:500;color:var(--mut);letter-spacing:.2em;margin-top:2px}
.bar{display:flex;gap:10px;width:100%;max-width:420px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center}
.pill b{display:block;font-size:20px}.pill span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
button.pri{background:var(--ac);color:#06130d;border-color:transparent;font-weight:700}
button:active{transform:scale(.97)}
.msg{min-height:24px;color:var(--mut);letter-spacing:.06em}
.g{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;width:min(90vw,400px);aspect-ratio:1;background:var(--line);padding:8px;border-radius:18px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,56px);gap:8px}.pad button{font-size:22px;padding:0}
.t{border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:min(8vw,32px)}
</style></head><body>
<h1>2048<small>Use the pad, swipe, or arrow keys</small></h1>
<div class="bar"><div class="pill"><b id="s">0</b><span>Score</span></div><div class="pill"><b id="h">0</b><span>Best</span></div></div>
<div class="g" id="g"></div><div class="msg" id="m"></div>
<div class="pad"><span></span><button data-d="u">&#9650;</button><span></span><button data-d="l">&#9664;</button><button class="pri" id="r">New</button><button data-d="r">&#9654;</button><span></span><button data-d="d">&#9660;</button><span></span></div>
<script>
let a,sc,best=+(localStorage.getItem('b2048')||0);h.textContent=best;
const col=v=>v?`hsl(${160+Math.log2(v)*18} 60% ${Math.max(28,70-Math.log2(v)*3)}%)`:'';
function add(){const e=[];a.forEach((r,i)=>r.forEach((v,j)=>v||e.push([i,j])));if(!e.length)return;const[p,q]=e[Math.random()*e.length|0];a[p][q]=Math.random()<.9?2:4}
function draw(){g.innerHTML='';a.flat().forEach(v=>{const d=document.createElement('div');d.className='t';d.textContent=v||'';d.style.background=col(v);d.style.color=v>4?'#fff':'var(--tx)';g.appendChild(d)});s.textContent=sc}
function slide(r){let n=r.filter(Boolean),g=0;for(let i=0;i<n.length-1;i++)if(n[i]==n[i+1]){n[i]*=2;g+=n[i];n.splice(i+1,1)}while(n.length<4)n.push(0);return[n,g]}
function mv(d){const b=JSON.stringify(a);let gain=0;const rot=m=>m[0].map((_,i)=>m.map(r=>r[i]).reverse());let m=a;const k={l:0,u:3,r:2,d:1}[d];for(let i=0;i<k;i++)m=rot(m);m=m.map(r=>{const[n,g]=slide(r);gain+=g;return n});for(let i=0;i<(4-k)%4;i++)m=rot(m);a=m;if(JSON.stringify(a)==b)return;sc+=gain;add();draw();if(sc>best){best=sc;h.textContent=best;try{localStorage.setItem('b2048',best)}catch(e){}}
if(a.flat().includes(2048))m_.textContent='You made 2048';else if(!can())m_.textContent='No moves left'}
const m_=document.getElementById('m');
function can(){for(let i=0;i<4;i++)for(let j=0;j<4;j++){if(!a[i][j])return 1;if(a[i][j+1]==a[i][j]||(a[i+1]&&a[i+1][j]==a[i][j]))return 1}return 0}
function reset(){a=Array.from({length:4},()=>Array(4).fill(0));sc=0;m_.textContent='';add();add();draw()}
r.onclick=reset;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>mv(b.dataset.d));addEventListener('keydown',e=>{const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];if(k){mv(k);e.preventDefault()}});
let sx,sy;g.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});g.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;mv(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))});reset();
</script></body></html>
